<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lectio — Biblioteca</title>
    <link rel="stylesheet" href="css/lectio.css" />
  </head>
  <body class="shell">
    <header class="topbar">
      <div class="brand" aria-label="Lectio home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Lectio</span>
      </div>
      <nav class="navbar" aria-label="Principal">
        <a href="index.html" class="nav-a">Inicio</a>
        <a href="pantallas.html" class="nav-a">Pantallas</a>
      </nav>
      <div class="inline-actions">
        <button class="icon-btn" aria-label="Buscar"><span class="i i-search" aria-hidden="true"></span></button>
        <button class="btn-3" type="button">Nueva recomendación</button>
      </div>
    </header>

    <main class="layout">
      <section class="frame">
        <div class="section-head">
          <div>
            <p class="t-label">Tu colección</p>
            <h1 class="t-h1">Biblioteca</h1>
          </div>
          <button class="btn" type="button">Añadir libro</button>
        </div>

        <div class="swimlane">
          <article class="card">
            <div class="card-cover" style="background: linear-gradient(145deg, #E86655 0%, #F5F0E6 100%);">El jardín de los finlandeses</div>
            <div class="card-copy">
              <h3 class="t-h3">La sombra del viento</h3>
              <p class="t-body">Carlos Ruiz Zafón</p>
              <div class="meta-row">
                <span class="badge">Leyendo</span>
                <span class="t-meta">68%</span>
              </div>
            </div>
          </article>

          <article class="card">
            <div class="card-cover" style="background: linear-gradient(145deg, #A78BCA 0%, #F5F0E6 100%);">Madres y hijas</div>
            <div class="card-copy">
              <h3 class="t-h3">Educated</h3>
              <p class="t-body">Tara Westover</p>
              <div class="meta-row">
                <span class="cond">Por intercambiar</span>
                <span class="t-meta">Buen estado</span>
              </div>
            </div>
          </article>

          <article class="card">
            <div class="card-cover" style="background: linear-gradient(145deg, #F4C95D 0%, #F5F0E6 100%);">Cuentos del sur</div>
            <div class="card-copy">
              <h3 class="t-h3">Pride &amp; Prejudice</h3>
              <p class="t-body">Jane Austen</p>
              <div class="meta-row">
                <span class="badge">Completado</span>
                <span class="t-meta">Sept 2026</span>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
