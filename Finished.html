<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lectio — Terminado</title>
    <link rel="stylesheet" href="css/lectio.css" />
  </head>
  <body class="shell">
    <header class="topbar">
      <div class="brand" aria-label="Lectio home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Lectio</span>
      </div>
      <nav class="navbar" aria-label="Principal">
        <a href="index.html" class="nav-a">Inicio</a>
        <a href="pantallas.html" class="nav-a">Pantallas</a>
      </nav>
      <div class="inline-actions">
        <button class="btn-3" type="button">Compartir</button>
      </div>
    </header>

    <main class="layout">
      <section class="frame" style="max-width: 760px; margin: 32px auto 0; text-align: center;">
        <p class="t-label">Lectura cerrada</p>
        <h1 class="t-h1" style="margin-top: 12px;">Terminaste <em>La sombra del viento</em></h1>
        <p class="t-body" style="margin-top: 12px;">Tu nota final ha quedado guardada y puedes pasar a la siguiente recomendación.</p>

        <div class="niche" style="margin: 28px auto 0; width: min(100%, 520px); min-height: 300px;">
          <div class="niche-card" style="max-width: 380px; min-height: 250px;">
            <div class="cover" style="background: linear-gradient(145deg, #E86655 0%, #F5F0E6 100%); color: var(--ink); min-height: 180px;">La sombra del viento</div>
            <div class="meta-row" style="margin-top: 12px;">
              <span class="badge">Reseña guardada</span>
              <span class="t-meta">4.9 / 5</span>
            </div>
          </div>
        </div>

        <div class="hero-actions" style="justify-content: center; margin-top: 28px;">
          <button type="button" class="btn-2">Ver mi biblioteca</button>
          <button type="button" class="btn">Siguiente lectura</button>
        </div>
      </section>
    </main>
  </body>
</html>
