services:
  - type: web
    name: lectio
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: PG_POOL_MAX
        value: "5"